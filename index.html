<style>
:root{
  --navy:#0B3A82; --navy-2:#0a2f69; --blue:#1976D2; --gold:#D9A62E; --gold-2:#b8861a;
  --green:#17A66A; --orange:#F4A11A; --red:#EF4B55; --purple:#7651D6; --teal:#19B6A3;
  --ink:#0f2a4d; --ink-2:#5a6b82; --line:#dde4ee; --bg:#f3f6fa; --card:#fff;
  --accent:var(--gold); --ok:var(--green); --warn:var(--red); --pend:var(--orange);
  --radius:14px; --shadow:0 6px 24px rgba(11,58,130,.12); --shadow-sm:0 1px 3px rgba(11,58,130,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 'Sarabun',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
#app{display:grid;grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100dvh;overflow:hidden}

/* header */
header{grid-column:1;grid-row:1;position:relative;background:linear-gradient(90deg,#fffaf0 0%,#fdf5e3 45%,#fbefd6 100%);color:var(--navy);padding:12px 22px 20px;display:flex;gap:14px;align-items:center;overflow:hidden;min-height:96px}
header::before{content:"";position:absolute;inset:0 auto 0 0;width:196px;background:linear-gradient(160deg,var(--navy) 0%,#123f8c 70%,#1d5bb8 100%);clip-path:polygon(0 0,100% 0,82% 100%,0 100%)}
header .brand{display:flex;align-items:center;gap:16px;min-width:0;z-index:1}
header .seal{width:76px;height:76px;border-radius:50%;background:#fff;border:3px solid var(--gold);display:grid;place-items:center;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.25);margin-left:40px}
header .seal svg{width:52px;height:42px}
header .seal img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block}
header h1{font-size:30px;margin:0;font-weight:800;line-height:1.1;white-space:nowrap;letter-spacing:-.2px;margin-left:58px}
header h1 b{color:var(--gold-2)}
header .org{font-size:16px;color:var(--navy);font-weight:600;white-space:nowrap;margin-left:58px}
header .sp{flex:1}

.hbtn{position:relative;z-index:1;background:#fff;border:1px solid #e7dcc4;color:var(--navy);border-radius:999px;padding:7px 14px;white-space:nowrap;font-weight:700;box-shadow:var(--shadow-sm);align-self:flex-start}
.hbtn:hover{background:#fffaf0}
#demoTag{z-index:1;background:var(--gold);color:#3b2a00;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;align-self:flex-start;margin-top:8px}

/* nav: sidebar (desktop) / bottom bar (mobile) */
nav#nav{grid-row:2;background:var(--navy);padding:0 16px;display:flex;flex-direction:row;gap:2px;align-items:stretch}
nav#nav button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:9px 16px 7px;font-weight:700;color:#c9d7ee;font-size:15px;border-bottom:3px solid transparent}
nav#nav button .ic{width:20px;height:20px;display:grid;place-items:center;flex:none}
nav#nav button .ic svg{width:19px;height:19px;fill:#c9d7ee}
nav#nav button:hover{color:#fff;background:rgba(255,255,255,.06)} nav#nav button:hover .ic svg{fill:#fff}
nav#nav button.on{color:#fff;border-bottom-color:var(--gold);background:rgba(255,255,255,.08)}
nav#nav button.on .ic svg{fill:var(--gold)}
nav#nav .art{display:none}
.view{min-height:0;min-width:0;grid-column:1;grid-row:3}
#vMap{display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
#vMap>#bar{grid-row:1} #vMap>main{grid-row:2}
#vHome,#vRounds{overflow-y:auto;padding:18px 20px 40px;background:linear-gradient(180deg,#fbf8f1 0,#f3f6fa 220px)}

/* cards & dashboard */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px}
.h2{font-size:20px;font-weight:700;margin:0 0 2px}
.muted{color:var(--ink-2);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.15fr);gap:12px;margin:0 0 14px}
.kpi{display:flex;gap:10px;align-items:center;border-radius:14px;padding:12px;color:#fff;box-shadow:var(--shadow-sm);border:0;text-align:left;min-width:0}
.kpi.k-blue{background:linear-gradient(135deg,#5aa5ef,#1976D2)} .kpi.k-green{background:linear-gradient(135deg,#3cc78c,#17A66A)} .kpi.k-orange{background:linear-gradient(135deg,#ffc04d,#F4A11A)} .kpi.k-red{background:linear-gradient(135deg,#ff7a83,#EF4B55)} .kpi.k-purple{background:linear-gradient(135deg,#9a7ef0,#7651D6)} .kpi.k-teal{background:linear-gradient(135deg,#3fc9bb,#119a8c)}
.kpi.k-date{background:#fff;color:var(--navy);border:1px solid var(--line)}
.kpi.k-date .bub{background:#eaf1fb} .kpi.k-date .bub svg{fill:var(--navy)}
button.kpi{cursor:pointer;font:inherit} button.kpi:hover{filter:brightness(1.04);transform:translateY(-1px)}
.kpi .bub{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.95)}
.kpi .bub svg{width:26px;height:26px}
.kpi .v{font-size:30px;font-weight:800;line-height:1.05}
.kpi .v small{font-size:14px;font-weight:600;margin-left:4px}
.kpi .l{font-size:13.5px;font-weight:600;opacity:.95;line-height:1.25}
.kpi>div{min-width:0}
.dgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:stretch;margin-bottom:14px}
.dgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.searchbar{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,1fr)) auto auto;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.searchbar input,.searchbar select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;min-width:0}
.searchbar .btn{padding:9px 16px}
.ptitle{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;color:var(--navy);margin:0 0 10px}
.ptitle svg{width:22px;height:22px}
.ptitle a,.ptitle button.lnk{margin-left:auto;font-size:14px;font-weight:600;color:var(--blue);background:none;border:0;padding:0;text-decoration:underline}
#homeMap{height:330px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line)}
.mlegend{position:absolute;left:10px;top:10px;z-index:500;background:#fff;border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px}
.mlegend b{display:block;margin-bottom:4px;color:var(--navy)}
.mlegend div{display:flex;align-items:center;gap:6px;line-height:1.7}
.donut{display:flex;align-items:center;gap:18px}
.donut svg{width:150px;height:150px;flex:none}
.dl{display:flex;flex-direction:column;gap:10px;font-size:14px}
.dl div{display:flex;gap:8px;align-items:flex-start}
.dl i{width:14px;height:14px;border-radius:50%;margin-top:3px;flex:none}
.dl b{display:block;font-size:17px}
.rank{display:flex;flex-direction:column}
.rank .r{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #eef2f7;font-size:14px;cursor:pointer}
.rank .r:first-child{border-top:0}
.rank .no{width:24px;height:24px;border-radius:50%;background:#fbefd0;color:#8a6200;font-weight:700;display:grid;place-items:center;font-size:13px}
.rank .r:hover{background:#f7f9fc}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.sec h3{margin:0;font-size:16px}
.rcard{position:relative;overflow:hidden}
.rcard + .rcard{margin-top:12px}
.rcard .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.rcard .t{font-weight:700;font-size:17px;line-height:1.3}
.rcard .meta{font-size:13px;color:var(--ink-2);margin-top:2px}
.rcard .pct{font-size:24px;font-weight:700;color:var(--navy);line-height:1}
.bar{height:10px;background:#e9eef5;border-radius:999px;overflow:hidden;display:flex;margin:10px 0 6px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend b{color:var(--ink)}
.legend .d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.mini{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:6px 10px;align-items:center;font-size:13px;margin-top:10px}
.mini .mb{height:7px;background:#e9eef5;border-radius:999px;overflow:hidden}
.mini .mb i{display:block;height:100%;background:var(--green)}
.mini .n{text-align:right;color:var(--ink-2)}
.racts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.due{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.due.ok{background:#e7f6ef;color:var(--green)} .due.soon{background:#fff3dc;color:#a86a00} .due.late{background:#fde9eb;color:var(--red)}
.feed{display:flex;flex-direction:column}
.feed .it{display:flex;gap:10px;padding:9px 0;border-top:1px solid #eef2f7;align-items:center}
.feed .it:first-child{border-top:0}
.feed .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.feed .doc{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none} .feed .doc svg{width:20px;height:20px;fill:#fff}
.feed .it{cursor:pointer} .feed .it:hover{background:#f7f9fc}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px 4px 5px;font-size:13px;font-weight:700;white-space:nowrap}
.pill i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center} .pill i svg{width:12px;height:12px;fill:#fff}
.pill.delivered{background:#e7f6ef;color:var(--green)} .pill.delivered i{background:var(--green)}
.pill.pending{background:#fff3dc;color:#a86a00} .pill.pending i{background:var(--orange)}
.pill.overdue,.pill.problem{background:#fde9eb;color:var(--red)} .pill.overdue i,.pill.problem i{background:var(--red)}
.feed .st svg{width:16px;height:16px;fill:#fff}
.feed .tx{flex:1;min-width:0;font-size:14px;line-height:1.35}
.feed .tx small{color:var(--ink-2)}
.feed img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}

<script>
/* ============ ตั้งค่า ============
   วาง URL เว็บแอปจาก Apps Script ที่นี่ (ลงท้ายด้วย /exec)
   ถ้าเว้นว่าง ระบบจะทำงานใน "โหมดทดลอง" เก็บข้อมูลไว้ในเครื่องนี้เท่านั้น */
const API_URL = '';
const MAP_CENTER = [13.0855, 100.9125];   // เทศบาลนครแหลมฉบัง
const SEED = DEMO_SEED();
function DEMO_SEED(){ return (typeof window.PAKMUD_SEED==='object' && window.PAKMUD_SEED) || null; }

/* ============ state ============ */
const S = {
  code: lsGet('dm_code') || '', name: lsGet('dm_name') || '',
  categories: [], places: [], rounds: [], items: [], routeList: [],
  roundId: '',
  cats: new Set(JSON.parse(lsGet('dm_cats') || '[]')),
  st: 'all', q: '', sel: null, near: null,
  routes: new Set(), view: lsGet('dm_view2') || 'map',
};
const DEMO = !API_URL;

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, ms=2600){const t=$('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('hide'),ms)}
const num = v => (v===''||v==null||isNaN(+v)) ? null : +v;
const hasPin = p => num(p.lat)!=null && num(p.lng)!=null;
const catColor = name => (S.categories.find(c=>c.name===name)||{}).color || '#5f6368';
function thDate(iso, withTime){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return iso;
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}) + (withTime? ' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' น.' : ''); }

/* ============ API (จริง + โหมดทดลอง) ============ */
async function api(action, payload={}){
  if (DEMO) return demoApi(action, payload);
  const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action, code:S.code}, payload))});
  const j = await res.json();
  if (!j.ok){ if (j.auth===false){ S.code=''; lsSet('dm_code',''); showLogin(j.error);} throw new Error(j.error||'เกิดข้อผิดพลาด'); }
  return j.data;
}

function demoDb(){
  let db=null; try{db=JSON.parse(localStorage.getItem('dm_demo')||'null')}catch(e){}
  if(!SEED) return db || {categories:[], places:[], rounds:[], items:[]};
  if(!db){ db={categories:SEED.categories, places:SEED.places.map(p=>Object.assign({phone:'',lat:'',lng:'',pinnedBy:'',pinnedAt:'',active:true},p)), rounds:[], items:[], routes:[], routesV2:true, seedVersion:SEED.version}; }
  else if(db.seedVersion!==SEED.version){
    // ข้อมูลตั้งต้นรุ่นใหม่: เติมเฉพาะช่องที่ยังว่าง (เบอร์โทร/หมายเหตุ/ผู้รับ) — หมุดที่ปักไว้ไม่ถูกแตะ
    SEED.categories.forEach(c=>{ if(!db.categories.some(x=>x.name===c.name)) db.categories.push(c); });
    SEED.places.forEach(sp=>{ const cur=db.places.find(x=>x.id===sp.id);
      if(!cur){ db.places.push(Object.assign({phone:'',lat:'',lng:'',pinnedBy:'',pinnedAt:'',active:true},sp)); return; }
      const m=String(cur.note||'').match(/\s*·\s*(สาย \d+)$/); if(m){ cur.note=cur.note.slice(0,m.index); if(!cur.route) cur.route=m[1]; }
      ['phone','note','recipient','route'].forEach(k=>{ if(sp[k] && !cur[k]) cur[k]=sp[k]; }); });
    db.categories.forEach(c=>{ const sc=SEED.categories.find(x=>x.name===c.name); if(sc) c.color=sc.color; });
    // รวมประเภท (เช่น ส่วนราชการ/องค์กร → แขกผู้มีเกียรติ) และเรียงลำดับประเภทตามข้อมูลตั้งต้น
    Object.entries(SEED.catMerge||{}).forEach(([from,to])=>{
      db.places.forEach(p=>{ if(p.category===from) p.category=to; });
      db.categories=db.categories.filter(c=>c.name!==from);
      (db.rounds||[]).forEach(r=>{ try{ const sc=JSON.parse(r.scope||'null'); if(sc&&sc.cats){ sc.cats=[...new Set(sc.cats.map(c=>c===from?to:c))]; r.scope=JSON.stringify(sc); } }catch(e){} });
    });
    const ord=n=>{ const i=SEED.categories.findIndex(x=>x.name===n); return i<0?999:i; };
    db.categories.sort((a,b)=>ord(a.name)-ord(b.name)); db.categories.forEach((c,i)=>c.order=i+1);
    if(!db.routesV2){ db.places.forEach(p=>{ if(/^สาย \d+$/.test(p.route||'')) p.route=''; }); db.routes=[]; db.routesV2=true; }
    db.seedVersion=SEED.version; try{localStorage.setItem('dm_demo',JSON.stringify(db))}catch(e){}
  }
  return db;
}
function demoSave(db){ try{localStorage.setItem('dm_demo',JSON.stringify(db))}catch(e){} DEMO_MEM=db; }
let DEMO_MEM=null;
async function demoApi(a, r){
  const db = DEMO_MEM || demoDb(); const now=new Date().toISOString(); const uid=()=>Math.random().toString(36).slice(2,10);
  const item = ()=>{ const it=db.items.find(i=>i.roundId===r.roundId&&i.placeId===r.placeId); if(!it) throw new Error('ไม่พบรายการ'); return it; };
  let out;
  switch(a){
    case 'load': out={categories:db.categories, places:db.places.filter(p=>p.active!==false), rounds:db.rounds, items:db.items, routes:db.routes||[]}; break;
    case 'saveRoute': { db.routes=db.routes||[]; const name=String(r.name||'').trim(); if(!name) throw new Error('กรุณาตั้งชื่อสายส่ง');
      if(name!==r.oldName && db.routes.some(x=>x.name===name)) throw new Error('มีสายส่งชื่อนี้อยู่แล้ว');
      let rt=db.routes.find(x=>x.name===(r.oldName||name)); if(!rt){ rt={name,people:'',order:db.routes.length+1}; db.routes.push(rt); }
      rt.name=name; rt.people=r.people||''; const want=new Set(r.placeIds||[]);
      db.places.forEach(p=>{ if(want.has(p.id)) p.route=name; else if(p.route===name || (r.oldName && p.route===r.oldName)) p.route=''; });
      out=rt; break; }
    case 'deleteRoute': db.routes=(db.routes||[]).filter(x=>x.name!==r.name); db.places.forEach(p=>{ if(p.route===r.name) p.route=''; }); out={ok:true}; break;
    case 'savePlace': { const p=r.place; if(!p.name) throw new Error('กรุณาระบุชื่อ');
      if(!p.id){p.id='P'+uid();p.active=true;db.places.push(p);out=p;} else {out=Object.assign(db.places.find(x=>x.id===p.id),p);} break; }
    case 'pinPlace': out=Object.assign(db.places.find(x=>x.id===r.id),{lat:r.lat,lng:r.lng,pinnedBy:r.by,pinnedAt:now}); break;
    case 'deletePlace': out=Object.assign(db.places.find(x=>x.id===r.id),{active:false}); break;
    case 'importPlaces': out=mergePlaces(db, r); break;
    case 'addCategory': if(db.categories.some(c=>c.name===r.name)) throw new Error('มีประเภทนี้อยู่แล้ว');
      out={name:r.name,color:r.color,order:db.categories.length+1}; db.categories.push(out); break;
    case 'createRound': { const rd={id:'R'+uid(),title:r.title||'',scope:r.scope||'',msg:r.msg||'',date:r.date,due:r.due||'',status:'open',createdBy:r.by,createdAt:now}; db.rounds.push(rd);
      const its=r.placeIds.map(pid=>({roundId:rd.id,placeId:pid,status:'pending',by:'',receivedBy:'',note:'',photoId:'',at:''})); db.items.push(...its); out={round:rd,items:its}; break; }
    case 'updateRound': out=db.rounds.find(x=>x.id===r.roundId); ['title','date','due','status','seq','scope','docName','msg'].forEach(k=>{if(r[k]!==undefined) out[k]=r[k]}); break;
    case 'setRoundPlaces': { const want=new Set(r.placeIds); const have=new Set();
      db.items=db.items.filter(it=>{ if(it.roundId!==r.roundId) return true; have.add(it.placeId); return want.has(it.placeId)||it.status!=='pending'; });
      want.forEach(pid=>{ if(!have.has(pid)) db.items.push({roundId:r.roundId,placeId:pid,status:'pending',by:'',receivedBy:'',note:'',photoId:'',at:''}); });
      out=db.items.filter(i=>i.roundId===r.roundId); break; }
    case 'deliver': out=Object.assign(item(),{status:r.status||'delivered',by:r.by,via:r.via||'',method:r.method||'',receivedBy:r.receivedBy,note:r.note,at:now}, r.photo?{photoId:r.photo}:{}, r.sign?{signId:r.sign}:{}); break;
    case 'deliverMany': out=r.placeIds.map(pid=>{ const x=db.items.find(i=>i.roundId===r.roundId&&i.placeId===pid); if(!x) return null;
        return Object.assign(x,{status:'delivered',by:r.by,via:r.via||'',method:r.method||'',receivedBy:r.receivedBy||'',note:r.note||'',at:now,group:r.placeIds.length>1?r.placeIds[0]:''}, r.photo?{photoId:r.photo}:{}, r.sign?{signId:r.sign}:{}); }).filter(Boolean); break;
    case 'undoDeliver': out=Object.assign(item(),{status:'pending',by:'',via:'',method:'',signId:'',receivedBy:'',note:'',photoId:'',at:''}); break;
    case 'resolveLink': throw new Error('โหมดทดลองแปลงลิงก์สั้นไม่ได้ ให้วางพิกัดตัวเลขแทน');
    default: throw new Error('unknown');
  }
  demoSave(db); return JSON.parse(JSON.stringify(out));
}

// รวมข้อมูลจากไฟล์สำรองเข้ากับข้อมูลปัจจุบัน (ใช้ทั้งโหมดทดลอง และฝั่ง Apps Script ใช้ตรรกะเดียวกัน)
function mergePlaces(db, r){
  let cats=0, upd=0, add=0;
  (r.categories||[]).forEach(c=>{ if(c.name && !db.categories.some(x=>x.name===c.name)){ db.categories.push({name:c.name,color:c.color||'#5f6368',order:db.categories.length+1}); cats++; } });
  db.routes=db.routes||[]; (r.routes||[]).forEach(x=>{ if(x.name && !db.routes.some(y=>y.name===x.name)) db.routes.push({name:x.name,people:x.people||'',order:db.routes.length+1}); });
  const F=['name','category','recipient','phone','email','lineName','note','lat','lng','pinnedBy','pinnedAt','route'];
  (r.places||[]).forEach(p=>{
    if(!p.id||!p.name) return;
    const cur=db.places.find(x=>x.id===p.id);
    if(cur){ let ch=false; F.forEach(k=>{ if(p[k]!==''&&p[k]!=null&&String(p[k])!==String(cur[k]??'')){ cur[k]=p[k]; ch=true; } }); if(ch) upd++; }
    else { const np={active:true}; F.forEach(k=>np[k]=p[k]??''); np.id=p.id; db.places.push(np); add++; }
  });
  return {categories:cats, updated:upd, added:add};
}

/* ============ ข้อมูลติดต่อเข้ารหัส (หน้าทดลองบนเว็บสาธารณะ) ============ */
const SECRET = (typeof window.PAKMUD_SECRET==='object' && window.PAKMUD_SECRET) || null;
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decryptContacts(code){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw', enc.encode(String(code).normalize('NFC').replace(/\s+/g,'')), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(SECRET.salt), iterations:SECRET.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(SECRET.iv)}, key, b64d(SECRET.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function applyContacts(code, silent){
  try{
    const data=await decryptContacts(code);
    const db=DEMO_MEM||demoDb(); let n=0;
    Object.entries(data).forEach(([id,c])=>{ const p=db.places.find(x=>x.id===id); if(!p) return;
      if(c.phone && !p.phone){ p.phone=c.phone; n++; } if(c.note && !p.note) p.note=c.note; });
    demoSave(db); lsSet('dm_team', code); await refresh(); updateLockBtn();
    if(!silent) toast(`ปลดล็อกข้อมูลติดต่อแล้ว (${n} รายการ)`,3500);
    return true;
  }catch(e){ if(!silent) toast('รหัสทีมไม่ถูกต้อง',3000); return false; }
}

/* ============ โหลดข้อมูล ============ */
async function refresh(silent){
  try{
    for(let i=0;i<3;i++){   // ถ้าต้องสร้าง/เติมชุดการส่ง ให้โหลดใหม่อีกรอบ
      const d = await api('load');
      S.categories=d.categories; S.places=d.places; S.rounds=d.rounds; S.items=d.items; S.routeList=d.routes||[];
      if(!(await ensureCurrent())) break;
    }
    S.cats.forEach(c=>{ if(!S.categories.some(x=>x.name===c)) S.cats.delete(c); });
    renderAll();
  }catch(e){ if(!silent) toast(e.message); }
}

/* ============ ชุดการส่งปัจจุบัน ============
   ไม่มี "รอบส่ง" ให้เลือกแล้ว — ระบบเก็บสถานะของทุกจุดไว้ในชุดเดียวเบื้องหลัง
   กด "เริ่มเรื่องใหม่" เมื่อจะส่งเอกสารเรื่องใหม่ สถานะทุกจุดจะกลับเป็นระหว่างส่ง (ชุดเดิมเก็บเป็นประวัติ) */
const DEFAULT_MSG='เรียน {ผู้รับ}\n\nงานประเพณีฯ กองการศึกษา เทศบาลนครแหลมฉบัง ขอส่ง{เรื่อง} รายละเอียดตามไฟล์แนบ\n\nจึงเรียนมาเพื่อโปรดทราบ\nงานประเพณีฯ กองการศึกษา เทศบาลนครแหลมฉบัง';
function fillMsg(r, p){ return String((r&&r.msg)||DEFAULT_MSG).replace(/\{ผู้รับ\}/g, p.recipient||p.name).replace(/\{ชื่อ\}/g, p.name).replace(/\{เรื่อง\}/g, (r&&r.title)||'หนังสือ'); }
function parseScope(r){ try{ const x=JSON.parse((r&&r.scope)||'null'); return x&&(x.cats||x.routes)?{cats:x.cats||[],routes:x.routes||[]}:null; }catch(e){ return null; } }
function inScope(p, sc){ return !sc || sc.cats.includes(p.category) || (p.route && sc.routes.includes(p.route)); }
const curRound = () => roundById(S.roundId);
async function ensureCurrent(){
  const cur=S.rounds.filter(r=>r.status!=='closed').pop();
  if(!cur){
    if(!S.places.length) return false;
    await api('createRound',{title:'', date:todayStr(), placeIds:S.places.map(p=>p.id), by:S.name});
    return true;
  }
  S.roundId=cur.id;
  if(/^ชุดการส่ง \d/.test(cur.title||'')){ await api('updateRound',{roundId:cur.id,title:''}); return true; }
  // เพิ่มจุดที่ตรงกับขอบเขตของเรื่องนี้แต่ยังไม่อยู่ในชุด (เช่น เพิ่มรายชื่อใหม่ภายหลัง) — ไม่ลบจุดที่เพิ่มเข้าเองทีละจุด
  const sc=parseScope(cur), have=new Set(S.items.filter(i=>i.roundId===cur.id).map(i=>i.placeId));
  const miss=S.places.filter(p=>inScope(p,sc) && !have.has(p.id)).map(p=>p.id);
  if(miss.length){ await api('setRoundPlaces',{roundId:cur.id, placeIds:[...have, ...miss]}); return true; }
  return false;
}

// ดาวเทียมแบบมีชื่อถนนและชื่อสถานที่ทับ (คล้ายมุมมองดาวเทียมของ Google Maps)

]);
let streetIdx=0, streetOk=false, streetErr=0, mode='map';
streetLayers.forEach((l,i)=>{

    if(streetOk||i!==streetIdx||mode!=='map') return;
    if(++streetErr>=4 && streetIdx<streetLayers.length-1){ map.removeLayer(l); streetIdx++; streetErr=0; streetLayers[streetIdx].addTo(map); }

const CAT_ICON={'ชุมชน':'c-home','สถานศึกษา':'c-school','บริษัท/ห้างร้าน':'c-brief','ส่วนราชการ/องค์กร':'c-gov','วัด':'c-temple','ผู้บริหาร/สมาชิกสภา':'c-person','ผู้ทรงคุณวุฒิ':'c-star','แขกผู้มีเกียรติ':'c-person'};
const catIcon = name => CAT_ICON[name] || (/วัด|มัสยิด|โบสถ์|ศาล/.test(name)?'c-temple':/โรงเรียน|ศึกษา/.test(name)?'c-school':'c-flag');
const ST_COLOR={delivered:'#17A66A',pending:'#F4A11A'};
const ST_TEXT={delivered:'ส่งสำเร็จ',pending:'ระหว่างส่ง'};
const ST_ICON={delivered:'i-check',pending:'i-clock'};
const svgUse=(id,cls='')=>`<svg viewBox="0 0 24 24"${cls?` class="${cls}"`:''}><use href="#${id}"/></svg>`;
const todayStr=()=>{ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const roundById = id => S.rounds.find(r=>r.id===id);
// มี 2 สถานะ: ระหว่างส่ง / ส่งสำเร็จ (ข้อมูลเก่าที่เป็น "มีปัญหา" นับเป็นระหว่างส่ง)
function effStatus(it){ if(!it) return null; return it.status==='delivered' ? 'delivered' : 'pending'; }
// สีหมุด: ส่งสำเร็จ = เขียว ไอคอนเครื่องหมายถูก / ระหว่างส่ง = สีประเภทเดิม
const markColor=(p,it)=> !it ? '#A3AEBD' : effStatus(it)==='delivered' ? ST_COLOR.delivered : catColor(p.category);
const markIcon=(p,it)=> effStatus(it)==='delivered' ? 'i-check' : catIcon(p.category);
function pinSvg(color, icon, size){
  const w=size, h=Math.round(size*1.25);
  return `<svg width="${w}" height="${h}" viewBox="0 0 40 50"><path d="M20 49C20 49 4 30.5 4 19a16 16 0 0 1 32 0c0 11.5-16 30-16 30z" fill="${color}" stroke="#fff" stroke-width="2.2"/><circle cx="20" cy="19" r="10.5" fill="#fff"/><svg x="12.5" y="11.5" width="15" height="15" viewBox="0 0 24 24" fill="${color}"><use href="#${icon}"/></svg></svg>`;
}
function pinIcon(p, it, big){
  const s=big?44:32;
  return L.divIcon({className:'spin', html:pinSvg(markColor(p,it), markIcon(p,it), s), iconSize:[s,Math.round(s*1.25)], iconAnchor:[s/2,Math.round(s*1.25)-1], tooltipAnchor:[0,-Math.round(s*1.1)]});
}

/* ============ ตัวกรอง ============ */
function roundItems(){ return S.roundId ? S.items.filter(i=>i.roundId===S.roundId) : []; }
function itemOf(pid){ return S.roundId ? S.items.find(i=>i.roundId===S.roundId && i.placeId===pid) : null; }
function basePlaces(){ return S.places; }
// จุดตามตัวกรองประเภท/สายส่ง (ไม่สนสถานะและคำค้น) ใช้กับแถบความคืบหน้า ใบเซ็นรับ และ Excel
function scopePlaces(){ return S.places.filter(p=>itemOf(p.id) && (!S.cats.size||S.cats.has(p.category)) && (!S.routes.size||S.routes.has(p.route||''))); }
function filtered(){
  const q = S.q.trim().toLowerCase();
  let arr = basePlaces().filter(p=>{
    if (S.cats.size && !S.cats.has(p.category)) return false;
    if (S.routes.size && !S.routes.has(p.route||'')) return false;
    if (q && !(p.name+' '+p.recipient+' '+(p.note||'')+' '+(p.route||'')+' '+(p.phone||'')).toLowerCase().includes(q)) return false;
    const it=itemOf(p.id);
    if (S.st==='nopin') return !hasPin(p) && (!!it || !!q);
    if (S.st==='out') return !it;
    if (!it && !q) return false;   // จุดที่ไม่ส่งเรื่องนี้ ซ่อนไว้ (ยกเว้นตอนค้นหา)
    if (S.st==='pending'||S.st==='delivered'){ if(!it || effStatus(it)!==S.st) return false; }
    return true;
  });
  if (S.near){ const d=p=>hasPin(p)? map.distance(S.near,[+p.lat,+p.lng]) : 1e12; arr.sort((a,b)=>d(a)-d(b)); }
  else { const ord=new Map(S.categories.map((c,i)=>[c.name,i])), idx=new Map(S.places.map((p,i)=>[p.id,i]));
    arr.sort((a,b)=>(ord.get(a.category)??99)-(ord.get(b.category)??99) || idx.get(a.id)-idx.get(b.id)); }
  return arr;
}

// ป้ายในรายการ: แสดงเฉพาะจุดที่ส่งสำเร็จ (จุดที่ระหว่างส่งไม่ต้องติดป้าย จะได้ไม่รก)
const METHOD_TXT={email:'ส่งทางอีเมล',line:'ส่งทาง LINE',share:'ส่งออนไลน์'};
function statusTag(it, always){
  const s=effStatus(it); if(!s) return always?'<span class="tag out">ไม่ส่งเรื่องนี้</span>':''; if(s==='pending' && !always) return '';
  if(s==='delivered' && it.via) return `<span class="tag via">ฝากส่ง</span>`;
  if(s==='delivered' && METHOD_TXT[it.method]) return `<span class="tag online">${METHOD_TXT[it.method]}</span>`;
  return `<span class="tag ${s}">${ST_TEXT[s]}</span>`;
}
function statusPill(s){ return s?`<span class="pill ${s}"><i>${svgUse(ST_ICON[s])}</i>${ST_TEXT[s]}</span>`:''; }

function renderList(){

/* ============ สรุปตัวเลข ============ */
function countItems(its){
  const c={total:its.length,delivered:0,pending:0,via:0};
  c.online=0; its.forEach(it=>{ const s=effStatus(it)||'pending'; c[s]++; if(s==='delivered'&&it.via) c.via++; if(s==='delivered'&&(it.method==='email'||it.method==='line')) c.online++; }); return c;
}
const countRound = rid => countItems(S.items.filter(i=>i.roundId===rid));
function barHtml(c){ const pct=x=>c.total?(x/c.total*100)+'%':'0';
  return `<i style="width:${pct(c.delivered)};background:var(--green)"></i><i style="width:${pct(c.pending)};background:var(--orange)"></i>`; }
function dueBadge(r){
  if(!r||!r.due) return '';
  const d=String(r.due).slice(0,10), days=Math.round((new Date(d)-new Date(todayStr()))/864e5);
  const c=countRound(r.id); if(c.total && c.delivered===c.total) return `<span class="due ok">ครบแล้ว</span>`;
  if(days<0) return `<span class="due late">เกินกำหนด ${-days} วัน</span>`;
  return `<span class="due ${days<=2?'soon':'ok'}">${days===0?'ครบกำหนดวันนี้':'เหลือ '+days+' วัน'} (${thDate(d)})</span>`;
}
const openRounds = () => S.rounds.filter(r=>r.status!=='closed');
function timeAgo(iso){ const m=Math.round((Date.now()-new Date(iso))/6e4); if(isNaN(m)) return ''; if(m<1) return 'เมื่อสักครู่'; if(m<60) return m+' นาทีที่แล้ว'; if(m<1440) return Math.round(m/60)+' ชม.ที่แล้ว'; return thDate(iso,true); }
const photoSrc = id => !id ? '' : String(id).startsWith('data:') ? id : `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w200`;

/* ============ มุมมอง (หน้าแรก / แผนที่ / รอบส่ง) ============ */
function setView(v){

function getPos(){
  return new Promise((ok,no)=>{
    if(!navigator.geolocation) return no(new Error('อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง'));
    navigator.geolocation.getCurrentPosition(p=>ok([p.coords.latitude,p.coords.longitude, p.coords.accuracy]),
      ()=>no(new Error('อ่านตำแหน่งไม่ได้ ตรวจสอบว่าอนุญาตตำแหน่งให้เบราว์เซอร์แล้ว')),{enableHighAccuracy:true,timeout:15000});
  });
}

let TRIP=null; const tripLayer=L.layerGroup().addTo(map); let tripWatch=null;
function orderStops(start, pts){
  // จุดใกล้สุดก่อน แล้วปรับด้วย 2-opt (ระยะเส้นตรง)
  const d=(a,b)=>map.distance(a,b), rest=pts.slice(), path=[]; let cur=start;
  while(rest.length){ let bi=0,bd=Infinity; rest.forEach((p,i)=>{ const x=d(cur,p.ll); if(x<bd){bd=x;bi=i;} }); cur=rest[bi].ll; path.push(rest.splice(bi,1)[0]); }
  const L2=[{ll:start},...path]; let improved=true, guard=0;
  while(improved && guard++<40){ improved=false;
    for(let i=1;i<L2.length-2;i++) for(let k=i+1;k<L2.length-1;k++){
      const a=L2[i-1].ll,b=L2[i].ll,c=L2[k].ll,e=L2[k+1].ll;
      if(d(a,c)+d(b,e) < d(a,b)+d(c,e)-1){ L2.splice(i,k-i+1,...L2.slice(i,k+1).reverse()); improved=true; } } }
  return L2.slice(1);
}
function tripCandidates(){
  return filtered().filter(hasPin).filter(p=>{ const it=itemOf(p.id); return !it || effStatus(it)!=='delivered'; });
}
function savedSeq(){
  const r=roundById(S.roundId); const s=r ? String(r.seq||'') : (lsGet('dm_seq_free')||'');
  return s ? s.split(',').filter(Boolean) : [];
}
async function saveSeq(ids){
  const v=ids.join(',');
  if(S.roundId){ try{ Object.assign(roundById(S.roundId), await api('updateRound',{roundId:S.roundId,seq:v})); }catch(e){ toast(e.message); } }
  else lsSet('dm_seq_free', v);
}
// เรียงตามลำดับที่บันทึกไว้ก่อน จุดที่ยังไม่อยู่ในลำดับจะต่อท้ายแบบใกล้สุดก่อน
function initialOrder(c, me){
  const seq=savedSeq(), ids=new Set(c.map(p=>p.id));
  const kept=seq.filter(id=>ids.has(id));
  const rest=c.filter(p=>!kept.includes(p.id)).map(p=>({id:p.id,ll:[+p.lat,+p.lng]}));
  if(!kept.length) return { ids:orderStops(me||rest[0].ll, rest).map(x=>x.id), saved:false };
  const last=S.places.find(x=>x.id===kept[kept.length-1]);
  return { ids:kept.concat(rest.length?orderStops([+last.lat,+last.lng], rest).map(x=>x.id):[]), saved:true };
}
function orderEditor(ids, me, onDone, title){
  ids=ids.slice(); const on=new Set(ids);
  const P=id=>S.places.find(x=>x.id===id);
  modal(`<h2>${title||'จัดเส้นทาง'}</h2>
    <div class="sub">ติ๊กเลือกจุดที่จะไปรอบนี้ แล้วเลื่อนลำดับด้วย ▲ ▼ ถ้าต้องกลับรถหรือมีทางลัด</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><button class="btn" id="oAll">เลือกทั้งหมด</button><button class="btn" id="oNone">ไม่เลือก</button><button class="btn" id="oAuto">↻ จัดใหม่ (ใกล้สุดก่อน)</button><button class="btn" id="oRev">⇅ กลับลำดับ</button></div>
    <div class="ordlist" id="oList"></div>
    <button class="btn pri" id="oGo" style="width:100%;margin-top:10px"></button>`, (el,close)=>{
    const draw=()=>{
      let prev=null, k=0;
      el.querySelector('#oList').innerHTML=ids.map((id,i)=>{ const p=P(id), sel=on.has(id);
        let d=''; if(sel){ k++; const from=prev?[+prev.lat,+prev.lng]:me; if(from){ const m=map.distance(from,[+p.lat,+p.lng]); d=(prev?'ห่างจากจุดก่อน ':'ห่างจากตำแหน่งฉัน ')+(m<1000?Math.round(m)+' ม.':(m/1000).toFixed(1)+' กม.'); } prev=p; }
        return `<div class="ord ${sel?'':'off'}"><label class="ock"><input type="checkbox" data-ck="${esc(id)}" ${sel?'checked':''}><span class="no">${sel?k:'–'}</span></label><div class="nm" data-tg="${esc(id)}"><b>${esc(p.name)}</b><small>${sel?d:'ไม่ไปรอบนี้'}${p.route?' · '+esc(p.route):''}</small></div>
          <button class="btn mv" data-up="${i}" ${i===0?'disabled':''} aria-label="เลื่อนขึ้น">▲</button><button class="btn mv" data-dn="${i}" ${i===ids.length-1?'disabled':''} aria-label="เลื่อนลง">▼</button></div>`; }).join('');
      const n=on.size; const g=el.querySelector('#oGo'); g.textContent=n?`🧭 นำทาง ${n} จุดที่เลือก`:'เลือกอย่างน้อย 1 จุด'; g.disabled=!n;
    };
    el.querySelector('#oList').onclick=e=>{ const u=e.target.closest('[data-up]'), d=e.target.closest('[data-dn]'), c=e.target.closest('[data-ck]'), t=e.target.closest('[data-tg]');
      if(c){ c.checked?on.add(c.dataset.ck):on.delete(c.dataset.ck); draw(); return; }
      if(t){ const id=t.dataset.tg; on.has(id)?on.delete(id):on.add(id); draw(); return; }
      if(u){ const i=+u.dataset.up; [ids[i-1],ids[i]]=[ids[i],ids[i-1]]; draw(); }
      if(d){ const i=+d.dataset.dn; [ids[i+1],ids[i]]=[ids[i],ids[i+1]]; draw(); } };
    el.querySelector('#oAll').onclick=()=>{ ids.forEach(id=>on.add(id)); draw(); };
    el.querySelector('#oNone').onclick=()=>{ on.clear(); draw(); };
    // จัดใหม่: เรียงเฉพาะจุดที่เลือกให้ใกล้สุดก่อน แล้วต่อด้วยจุดที่ไม่ได้เลือก
    el.querySelector('#oAuto').onclick=()=>{ const sel=ids.filter(id=>on.has(id)), rest=ids.filter(id=>!on.has(id)); if(!sel.length) return;
      const pts=sel.map(id=>{ const p=P(id); return {id,ll:[+p.lat,+p.lng]}; }); ids=orderStops(me||pts[0].ll, pts).map(x=>x.id).concat(rest); draw(); el.querySelector('#oList').scrollTop=0; };
    el.querySelector('#oRev').onclick=()=>{ ids.reverse(); draw(); };
    el.querySelector('#oGo').onclick=e=>busy(e.target, async()=>{ const sel=ids.filter(id=>on.has(id)); close(); await onDone(sel, ids); });
    draw();
  });
}
async function startTrip(){
  if(PIN) endPin();
  const c=tripCandidates();
  if(!c.length){ toast('ไม่มีจุดที่ระหว่างส่งและมีหมุดตามตัวกรองนี้',4500); return; }
  const unp=filtered().filter(p=>!hasPin(p)).length;
  let me=null;
  try{ const g=await getPos(); showMe(g); me=[g[0],g[1]]; }catch(e){ toast('อ่านตำแหน่งไม่ได้ จะเริ่มจากจุดแรกในรายการแทน',3500); }
  const init=initialOrder(c, me);
  orderEditor(init.ids, me, async (ids, all)=>{
    await saveSeq(all);
    TRIP={ids, idx:0, me};
    document.body.classList.add('tripping'); $('tripBar').classList.remove('hide'); setTimeout(()=>map.invalidateSize(),50);
    if(navigator.geolocation && tripWatch==null) tripWatch=navigator.geolocation.watchPosition(p=>{ if(!TRIP) return; TRIP.me=[p.coords.latitude,p.coords.longitude]; showMe(TRIP.me); tripInfo(); },()=>{}, {enableHighAccuracy:true,maximumAge:15000});
    tripGo(0, true);
  }, init.saved?'จัดเส้นทาง (ใช้ลำดับที่บันทึกไว้)':'จัดเส้นทาง');
}
function tripDraw(){
  tripLayer.clearLayers(); if(!TRIP) return;
  const lls=TRIP.ids.map(id=>{ const p=S.places.find(x=>x.id===id); return [+p.lat,+p.lng]; });
  const line=(TRIP.me?[TRIP.me]:[]).concat(lls.slice(TRIP.idx));
  if(line.length>1) L.polyline(line,{color:'#0B3A82',weight:4,opacity:.75,dashArray:'8 8'}).addTo(tripLayer);
  lls.forEach((ll,i)=>{ if(i<TRIP.idx) return; L.marker(ll,{interactive:false,zIndexOffset:3000+(i===TRIP.idx?100:0),icon:L.divIcon({className:'',html:`<div class="tnum ${i===TRIP.idx?'cur':''}">${i+1}</div>`,iconSize:[22,22],iconAnchor:[11,52]})}).addTo(tripLayer); });
}
function gmapsDir(stops){
  const enc=ll=>ll[0].toFixed(6)+','+ll[1].toFixed(6);
  const dest=stops[stops.length-1], way=stops.slice(0,-1);
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+enc(dest)+(way.length?'&waypoints='+encodeURIComponent(way.map(enc).join('|')):'');
}
function tripInfo(){
  if(!TRIP) return; const id=TRIP.ids[TRIP.idx]; const p=S.places.find(x=>x.id===id); if(!p) return;
  const ll=[+p.lat,+p.lng];
  let dist=''; if(TRIP.me){ const m=map.distance(TRIP.me,ll); dist=m<1000?Math.round(m)+' ม.':(m/1000).toFixed(1)+' กม.'; }
  $('tNo').textContent=`${TRIP.idx+1}/${TRIP.ids.length}`;
  $('tName').textContent=p.name;
  $('tSub').textContent=[dist?'ห่าง '+dist:'', p.recipient, p.phone?'โทร '+p.phone:''].filter(Boolean).join(' · ');
}
function tripGo(i, fitAll){
  if(!TRIP) return;
  if(TRIP && i>TRIP.idx) while(i<TRIP.ids.length && effStatus(itemOf(TRIP.ids[i]))==='delivered') i++;   // ข้ามจุดที่บันทึกไปแล้ว (เช่น บันทึกหลายจุดพร้อมกัน)
  if(i>=TRIP.ids.length){ toast('ครบทุกจุดในเส้นทางแล้ว 🎉',4000); endTrip(); return; }
  TRIP.idx=Math.max(0,i);
  const id=TRIP.ids[TRIP.idx], p=S.places.find(x=>x.id===id), ll=[+p.lat,+p.lng];
  const next4=TRIP.ids.slice(TRIP.idx).filter((x,k)=>k===0||effStatus(itemOf(x))!=='delivered').slice(0,4).map(x=>{ const q=S.places.find(y=>y.id===x); return [+q.lat,+q.lng]; });
  // Google Maps บนมือถือรับจุดแวะได้ 3 จุด จึงส่งต่อเนื่องทีละ 4 จุด (จุดนี้ + อีก 3) — บันทึกครบแล้วกดนำทางอีกครั้งจะได้ชุดถัดไป
  $('tNav').href=gmapsDir(next4); $('tNav').textContent= next4.length>1 ? `🧭 นำทาง ${next4.length} จุด` : '🧭 นำทาง';
  $('tMulti').href=gmapsDir([ll]); $('tMulti').classList.toggle('hide',next4.length<2);
  $('tPrev').disabled=TRIP.idx===0;
  const it=itemOf(id); $('tDone').classList.toggle('hide',!it);
  S.sel=id; tripInfo(); tripDraw(); renderList(); renderMap();
  if(fitAll){ const all=TRIP.ids.map(x=>{ const q=S.places.find(y=>y.id===x); return [+q.lat,+q.lng]; }).concat(TRIP.me?[TRIP.me]:[]); map.fitBounds(L.latLngBounds(all).pad(.15),{maxZoom:16}); }
  else map.setView(ll, Math.max(map.getZoom(),15));
}
function endTrip(){ TRIP=null; tripLayer.clearLayers(); $('tripBar').classList.add('hide'); document.body.classList.remove('tripping');
  if(tripWatch!=null && navigator.geolocation){ navigator.geolocation.clearWatch(tripWatch); tripWatch=null; } setTimeout(()=>map.invalidateSize(),50); renderMap(); }

function modal(html, onMount){
  const o=document.createElement('div'); o.className='ovl';
  o.innerHTML=`<div class="sheet"><button class="x" aria-label="ปิด">×</button>${html}</div>`;
  const close=()=>o.remove();

async function shareDoc(doc, title, text){
  const file=new File([doc.blob], doc.name, {type:doc.type||'application/octet-stream'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title, text}); return true; }
    catch(e){ if(e.name==='AbortError') return false; toast('แชร์ไม่สำเร็จ: '+e.message,4000); return false; }
  }
  // เครื่องที่แชร์ไฟล์ไม่ได้: ดาวน์โหลดไฟล์ให้แนบเอง
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=doc.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},3000);
  return confirm('เครื่องนี้แชร์ไฟล์ตรงไม่ได้ ระบบดาวน์โหลดไฟล์ให้แล้ว\nแนบไฟล์ส่งเองใน LINE/อีเมล แล้วกด OK เพื่อบันทึกว่าส่งแล้ว');
}

function signPad(who, done){
  modal(`<h2>ลายเซ็นผู้รับ</h2><div class="sub">${esc(who)} · เซ็นด้วยนิ้วในกรอบ</div>
    <div class="sigwrap"><canvas id="sgC"></canvas></div>
    <div class="grid2" style="margin-top:10px"><button class="btn" id="sgClr">ล้าง</button><button class="btn pri" id="sgOk">ใช้ลายเซ็นนี้</button></div>`, (el,close)=>{
    const c=el.querySelector('#sgC'), ctx=c.getContext('2d'); let drawing=false, inked=false, last=null;
    const fit=()=>{ const r=c.getBoundingClientRect(), d=window.devicePixelRatio||1; c.width=r.width*d; c.height=r.height*d; ctx.setTransform(d,0,0,d,0,0); ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0b1f44'; };
    setTimeout(fit,30);
    const pt=e=>{ const r=c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
    c.onpointerdown=e=>{ drawing=true; last=pt(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0],last[1],1.2,0,7); ctx.fillStyle='#0b1f44'; ctx.fill(); inked=true; };
    c.onpointermove=e=>{ if(!drawing) return; const p2=pt(e); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke(); last=p2; inked=true; };
    c.onpointerup=c.onpointercancel=()=>{ drawing=false; };
    el.querySelector('#sgClr').onclick=()=>{ ctx.clearRect(0,0,c.width,c.height); inked=false; };
    el.querySelector('#sgOk').onclick=()=>{ if(!inked){ toast('ยังไม่ได้เซ็น'); return; }
      const o=document.createElement('canvas'), k=Math.min(1,600/c.width); o.width=c.width*k; o.height=c.height*k; const x=o.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,o.width,o.height); x.drawImage(c,0,0,o.width,o.height);
      done(o.toDataURL('image/jpeg',.8)); close(); };
  });
}

/* ============ ไฟล์หนังสือของเรื่องที่ส่ง ============
   โหมดทดลอง: เก็บใน IndexedDB ของเครื่อง · โหมดจริง: เก็บใน Google Drive ผ่าน Apps Script แล้วแคชไว้ในเครื่อง */
const MAX_DOC=8*1024*1024;
const fmtSize=n=> n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';
function idb(){ return new Promise((ok,no)=>{ const r=indexedDB.open('thungmue',1); r.onupgradeneeded=()=>r.result.createObjectStore('docs'); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(ok=>{ const q=db.transaction('docs').objectStore('docs').get(k); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null); }); }catch(e){ return null; } }
async function idbPut(k,v){ try{ const db=await idb(); await new Promise(ok=>{ const t=db.transaction('docs','readwrite'); t.objectStore('docs').put(v,k); t.oncomplete=ok; t.onerror=ok; }); }catch(e){} }
const b64ToBlob=(b64,type)=>new Blob([Uint8Array.from(atob(b64),c=>c.charCodeAt(0))],{type});
const blobToB64=blob=>new Promise(ok=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
async function putDoc(roundId, file){
  const v={name:file.name, type:file.type, size:file.size, blob:file};
  if(!DEMO){ const out=await api('saveDoc',{roundId, name:file.name, type:file.type, data:await blobToB64(file)}); v.docId=out.docId; }
  else await api('updateRound',{roundId, docName:file.name});
  await idbPut('doc:'+roundId, v);
}
async function getDoc(r){
  if(!r||!r.id) return null;
  const c=await idbGet('doc:'+r.id); if(c && (DEMO || c.docId===r.docId)) return c;
  if(!DEMO && r.docId){ try{ const d=await api('getDoc',{roundId:r.id}); const v={name:d.name,type:d.type,size:d.size,blob:b64ToBlob(d.data,d.type),docId:r.docId}; await idbPut('doc:'+r.id,v); return v; }catch(e){ toast(e.message); } }
  return null;
}

function shrink(file){
  return new Promise((ok,no)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,1280/Math.max(img.width,img.height)); const c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg',.72)); };
    img.onerror=()=>no(new Error('อ่านรูปไม่ได้')); img.src=url;
  });
}

function nextUnpinned(afterId){

function startPin(id){

function setPinLL(ll, zoom){
  PIN.ll=[+ll[0],+ll[1]];
  if(!PIN.marker){

function coordsFromText(s){
  try{ s=decodeURIComponent(s); }catch(e){}
  const pats=[/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,/[?&](?:q|query|ll|destination)=(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/,/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,/^\s*\(?(-?\d{1,2}\.\d{3,})\s*[, ]\s*(-?\d{1,3}\.\d{3,})\)?\s*$/];
  for(const re of pats){ const m=s.match(re); if(m) return [+m[1],+m[2]]; }
  return null;
}
$('pinLinkGo').onclick=e=>busy(e.target, async()=>{
  const v=$('pinLink').value.trim(); if(!v) return;
  let ll=coordsFromText(v);
  if(!ll && /^https?:\/\//.test(v)){ const r=await api('resolveLink',{url:v}); ll=[r.lat,r.lng]; }
  if(!ll) throw new Error('อ่านพิกัดจากข้อความนี้ไม่ได้');
  setPinLL(ll,17); toast('วางหมุดแล้ว ตรวจตำแหน่งแล้วกดบันทึก');
});

// ค้นชื่อสถานที่: ลองหลายแบบ (ชื่อเต็ม / ตัดคำว่า บริษัท จำกัด มหาชน) จาก 2 แหล่ง แล้วเรียงจากใกล้แหลมฉบังก่อน
function searchVariants(q){
  const v=[q];
  const c=q.replace(/\(มหาชน\)|มหาชน|บริษัท|บจก\.?|ห้างหุ้นส่วน(จำกัด|สามัญ)?|หจก\.?|จำกัด|สาขา.*$/g,' ').replace(/\s+/g,' ').trim();
  if(c && c!==q) v.push(c);
  const en=q.match(/[A-Za-z][A-Za-z0-9 .&-]{2,}/); if(en) v.push(en[0].trim());
  return [...new Set(v)];
}
async function placeSearch(q){
  const vb='100.80,13.22,101.06,12.95', out=[], seen=new Set();
  const add=(lat,lng,name)=>{ const k=(+lat).toFixed(4)+','+(+lng).toFixed(4); if(seen.has(k)) return; seen.add(k); out.push({lat:+lat,lng:+lng,name}); };
  const jobs=[];
  searchVariants(q).forEach(t=>{
    jobs.push(fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=th&accept-language=th&viewbox='+vb+'&q='+encodeURIComponent(t)).then(r=>r.json()).then(a=>a.forEach(x=>add(x.lat,x.lon,x.display_name))).catch(()=>{}));
    jobs.push(fetch('https://photon.komoot.io/api/?limit=6&lat='+MAP_CENTER[0]+'&lon='+MAP_CENTER[1]+'&q='+encodeURIComponent(t)).then(r=>r.json()).then(j=>(j.features||[]).forEach(f=>{ const pr=f.properties||{}; if(pr.countrycode && pr.countrycode!=='TH') return;
      add(f.geometry.coordinates[1],f.geometry.coordinates[0],[pr.name,pr.street,pr.district||pr.city,pr.state].filter(Boolean).join(', ')); })).catch(()=>{}));
  });
  await Promise.all(jobs);
  const d=x=>map.distance(MAP_CENTER,[x.lat,x.lng]);
  return out.filter(x=>d(x)<40000).sort((a,b)=>d(a)-d(b)).slice(0,10);
}
$('pinSearchGo').onclick=e=>busy(e.target, async()=>{
  const q=$('pinSearch').value.trim(); if(!q) return;
  const r=await placeSearch(q);
  const g=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q+' แหลมฉบัง')}`;
  const km=x=>{ const m=map.distance(MAP_CENTER,[x.lat,x.lng]); return m<1000?Math.round(m)+' ม.':(m/1000).toFixed(1)+' กม.'; };
  $('pinResults').innerHTML = (r.length ? r.map(x=>`<div data-ll="${x.lat},${x.lng}">${esc(x.name)} <small style="color:var(--ink-2)">· ห่าง ${km(x)}</small></div>`).join('')
      : '<div style="color:var(--ink-2);cursor:default">ไม่พบในแผนที่ฟรี (บริษัทในนิคม/ท่าเรือมักไม่มีชื่อ)</div>')
    + `<div class="gtip">ไม่เจอ? <a href="${g}" target="_blank" rel="noopener">ค้นใน Google Maps ↗</a> เจอแล้ว<b>แตะค้างที่ตึก</b> จะขึ้นตัวเลขพิกัด แตะคัดลอก แล้วกลับมากด <b>🔗 ลิงก์/พิกัด</b> วางได้เลย</div>`;
});
$('pinSearch').onkeydown=e=>{ if(e.key==='Enter') $('pinSearchGo').click(); };
$('pinResults').onclick=e=>{ const d=e.target.closest('[data-ll]'); if(!d) return; setPinLL(d.dataset.ll.split(','),17); $('pinResults').innerHTML=''; };
$('pinSave').onclick=e=>busy(e.target, async()=>{
  if(!PIN||!PIN.ll) return;
  const lat=+PIN.ll[0].toFixed(6), lng=+PIN.ll[1].toFixed(6);
  const out=await api('pinPlace',{id:PIN.id,lat,lng,by:S.name});
  Object.assign(S.places.find(x=>x.id===PIN.id), out); const id=PIN.id;
  const nx = $('pinChain').checked ? nextUnpinned(id) : null;
  endPin(); S.sel=id; renderAll();
  if(nx){ startPin(nx.id); toast('บันทึกหมุดแล้ว ✓ ต่อไป: '+nx.name,3000); } else toast('บันทึกหมุดแล้ว ✓');
});

/* ============ รอบส่ง ============ */
function roundRows(){
  const order=new Map(S.categories.map((c,i)=>[c.name,i]));
  return scopePlaces().map(p=>({p, it:itemOf(p.id)||{status:'pending'}}))
    .sort((a,b)=>(order.get(a.p.category)??99)-(order.get(b.p.category)??99) || S.places.indexOf(a.p)-S.places.indexOf(b.p));
}
function printSheet(){
  const rows=roundRows(); let cur='', n=0;
  const scope=[...S.cats,...S.routes].join(', ');
  const body=rows.map(({p,it})=>{ let g=''; if(p.category!==cur){cur=p.category; g=`<tr class="g"><td colspan="4">${esc(cur)}</td></tr>`;} n++;
    const person=/ผู้บริหาร|ผู้ทรงคุณวุฒิ|แขก/.test(p.category);
    const who=person ? `${esc(p.name)}<br><small>${esc(p.recipient)}</small>` : esc(p.recipient||p.name);
    const done=it&&it.status==='delivered';
    const sig=it&&it.signId?`<img src="${esc(signSrc(it.signId))}" style="max-height:38px;max-width:100%">${it.via?`<br><small>(${esc(it.via)} รับฝาก)</small>`:''}`:done&&it.via?`<small>ฝาก ${esc(it.via)}</small>`:done&&METHOD_TXT[it.method]?`<small>${METHOD_TXT[it.method]}</small>`:'';
    return g+`<tr><td style="text-align:center">${n}</td><td>${who}</td><td style="text-align:center">${sig}</td><td style="text-align:center;white-space:nowrap">${done&&it.at?esc(thDate(it.at)):''}</td></tr>`; }).join('');
  const r=curRound()||{};
  $('printArea').innerHTML=`<h1>ใบเซ็นรับหนังสือ</h1>
    <p class="s">${r.title?'เรื่อง '+esc(r.title)+'<br>':''}งานประเพณีฯ กองการศึกษา เทศบาลนครแหลมฉบัง${scope?' · '+esc(scope):''}</p>
    <table><thead><tr><th style="width:7%">ที่</th><th>ผู้รับ / หน่วยงาน</th><th style="width:30%">ลายมือชื่อผู้รับ</th><th style="width:16%">วันที่รับ</th></tr></thead><tbody>${body}</tbody></table>
    <p class="f">ผู้นำส่ง ........................................................ &nbsp; พิมพ์เมื่อ ${esc(new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}))}</p>`;
  const imgs=[...$('printArea').querySelectorAll('img')];
  Promise.all(imgs.map(i=>i.complete?0:new Promise(ok=>{ i.onload=i.onerror=ok; setTimeout(ok,4000); }))).then(()=>setTimeout(()=>window.print(),50));
}
function exportCsv(){
  const st=ST_TEXT;
  const head=['ที่','ประเภท','สายส่ง','ชื่อ','ผู้รับ/ตำแหน่ง','สถานะ','ผู้บันทึก','ฝากส่งโดย','ผู้รับเอกสาร','เวลา','หมายเหตุ','ลิงก์รูป'];
  const st2=st; const lines=roundRows().map(({p,it},i)=>[i+1,p.category,p.route||'',p.name,p.recipient,(effStatus(it)==='delivered'?(it.via?'ฝากส่ง':METHOD_TXT[it.method]||'ส่งสำเร็จ'):st2[effStatus(it)]||it.status),it.by,it.via||'',it.receivedBy,it.at?thDate(it.at,true):'',it.note,
    it.photoId&&!String(it.photoId).startsWith('data:')?'https://drive.google.com/file/d/'+it.photoId+'/view':'']);
  const csv='﻿'+[head,...lines].map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`ถึงมือ-สถานะการส่ง-${todayStr()}.csv`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},2000);
}

const BUILD_ID='20261010150959';
async function checkUpdate(){
  if(location.protocol==='file:' || BUILD_ID.startsWith('__')) return;
  try{ const v=(await (await fetch('version.txt?t='+Date.now(),{cache:'no-store'})).text()).trim();
    if(v && v!==BUILD_ID) $('updBar').classList.remove('hide'); }catch(e){}
}
$('updBar').onclick=()=>{ location.replace(location.pathname+'?v='+Date.now()); };
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });
setTimeout(checkUpdate,3000); setInterval(checkUpdate,5*60000);

  lsSet('dm_code',S.code); lsSet('dm_name',S.name);
  $('lgErr').textContent='';
  await refresh(); if(S.categories.length){ $('login').classList.add('hide'); setView('map'); renderMap(true); }
});
$('lgCode').onkeydown=$('lgName').onkeydown=e=>{ if(e.key==='Enter') $('lgGo').click(); };

(async function start(){
  const firstView = ['home','map','rounds'].includes(S.view) ? S.view : 'map';
  if(DEMO){ $('demoTag').classList.remove('hide'); if(!S.name){ S.name='ทดลอง'; } await refresh(); setView(firstView); renderMap(true);
    if(SECRET){ const c=lsGet('dm_team'); if(c && contactsLocked()) await applyContacts(c,true); updateLockBtn(); }
    if(!SEED && !S.places.length) toast('ไม่พบไฟล์ pakmud-demo-data.js ให้วางไว้โฟลเดอร์เดียวกับ index.html',6000); return; }

  setInterval(()=>{ if(document.visibilityState==='visible' && !PIN && !document.querySelector('.ovl')) refresh(true); }, 30000);
})();
